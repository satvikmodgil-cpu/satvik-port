<html>
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        body {
            background-color: rgb(31, 41, 24);
            margin: 0;
            padding: 0;
            
        }
        .gal-header {
            text-align: center;
            color: rgb(255, 222, 130);
            padding: 50px 60px;
        }
        .back-home {
            display: block;
            text-align: center;
            color: rgb(255, 222, 130);
            text-decoration: underline;
            margin-top: 30px;
            transition: transform 0.3s ease, color 0.3s ease; /* Smooth transition for hover effect */
        }
        .back-home:hover {
            color: white; /* Change color on hover */
            transform: translateY(-2px) scale(1.05); /* Slightly move up and enlarge on hover */
        }
        .gallery-grid{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .image-card {
            position: relative;
            overflow: hidden;
            border-radius: 7px;
            height: 450px;
            background-color: rgb(24,31,18);
        }
        .gallery-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s ease;
            object-position: center; 
            image-rendering: -webkit-optimize-contrast; /* Enhance image quality */
            image-rendering: crisp-edges;
        }
        .image-card:hover .gallery-img {
            transform: scale(1.1); /* Zoom in on hover */
            filter:brightness(1.1); /* Slightly brighten the image on hover */
        }
    </style>




</head>
<body>
<header class="gal-header">
    <a href="index.html" class="back-home">Back to Home</a>
    <h1> Through my lens   </h1>
</header>

<main class="gallery-grid">
<div class="image-card">
    <img src="img1.jpg" alt="Gallery Image 1" class="gallery-img" loading="lazy">
</div>
<div class="image-card">
    <img src="img2.jpg" alt="Gallery Image 2" class="gallery-img" loading="lazy">   
    </div>
<div class="image-card">
    <img src="img3.jpg" alt="Gallery Image 3" class="gallery-img" loading="lazy">
</div>
<div class="image-card">
    <img src="owl.jpg" alt="Gallery Image 4" class="gallery-img" loading="lazy">
    </div>




















</main>






</body>


</html>
